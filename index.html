<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="stylesheet" href="./output.css">
  <title>Frontend Mentor | Meet landing page</title>
</head>

<body>
  <section class="min-w-[375px] min-h-[screen] flex flex-col items-center">
    <img class="w-[118px] mt-[48px] mb-[64px]" src="./assets/logo.svg" alt="Logo">
    <div class="gap-[48px] flex flex-col items-center">
        <img src="./assets/tablet/image-hero.png" alt="" class="">

        <!-- Hero text -->
        <div class="gap-[24px] flex flex-col items-center w-[305px] text-center">
            <p class="text-preset-1">Group Chat for Everyone</p>
            <p>Meet makes it easy to connect with others face-to-face virtually and collaborate across any device.</p>

            <!-- Button -->
            <div class="gap-[16px] flex flex-col text-white items-center">
              <button class="bg-cyan-600 rounded-[29px] px-[40px] py-[16px]">
                <span>Download</span>
                <span class="text-cyan-300">v1.3</span>
              </button>
              <button class="bg-purple-600 rounded-[29px] w-fit px-[40px] py-[16px]">What is it?</button>
            </div>
        </div>
    </div>
  </section>
</body>

</html>
